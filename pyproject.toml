[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "polymarket-bot"
version = "1.0.0"
description = "Polymarket trading bot: complete-set arbitrage, neg-risk basket arbitrage, and fade-extreme mean reversion."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "polymarket-bot contributors" }]
keywords = ["polymarket", "prediction-markets", "trading-bot", "arbitrage", "clob"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business :: Financial :: Investment",
]
# Core runtime has no third-party dependencies: paper mode uses the standard
# library only. Live trading needs one of the optional clients below.
dependencies = []

[project.optional-dependencies]
# Recommended live-trading client (current official SDK, import name `polymarket`).
sdk = ["polymarket-client>=0.11.0"]
# Alternative live-trading client (previous official client).
clob = ["py-clob-client-v2>=1.2.0"]
live = ["polymarket-client>=0.11.0", "py-clob-client-v2>=1.2.0"]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
polymarket-bot = "polymarket_bot.cli:main"

[project.urls]
Homepage = "https://github.com/jablay46/polymarket-bot"
Issues = "https://github.com/jablay46/polymarket-bot/issues"

[tool.setuptools]
packages = ["polymarket_bot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
